name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Display .NET information
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore Bookify.Services.Booking.slnx

      - name: Build
        run: >
          dotnet build
          Bookify.Services.Booking.slnx
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test
          Bookify.Services.Booking.slnx
          --configuration Release
          --no-build
          --no-restore